# Codly light palette, shared by FlatLightLaf and FlatMacLightLaf.
@accentColor = #6458e8
@background = #f7f8fa
@foreground = #202738
@componentBackground = #ffffff
@selectionBackground = #eeeafe
@selectionForeground = #202738

Component.arc = 12
Component.focusWidth = 1
Component.focusColor = #b5adff
Component.borderColor = #e2e6ee
Component.disabledBorderColor = #e2e6ee
Button.arc = 12
Button.margin = 8,16,8,16
Button.minimumWidth = 0
Button.background = #ffffff
Button.foreground = #202738
Button.hoverBackground = #eeeafe
Button.pressedBackground = #e2e6ee
Button.disabledBackground = #f7f8fa
Button.disabledText = #929aaa

[style]Button.primary = background: #6458e8; foreground: #ffffff; hoverBackground: #574bd9; pressedBackground: #4e43c7; focusedBackground: #6458e8; disabledBackground: #b9b4e6; disabledText: #ffffff; borderColor: #6458e8; disabledBorderColor: #b9b4e6
[style]Button.secondary = default.background: #ffffff; default.foreground: #202738; default.hoverBackground: #eeeafe; default.pressedBackground: #e2e6ee; default.focusedBackground: #ffffff; default.borderColor: #e2e6ee
[style]Button.current = background: #eeeafe; foreground: #4f43bd; borderColor: #e2dcf7; hoverBackground: #e7e1fc; pressedBackground: #dfd7fb

TextField.margin = 7,10,7,10
PasswordField.margin = 7,10,7,10
PasswordField.showRevealButton = true
TextArea.margin = 8,10,8,10
TextPane.margin = 8,10,8,10
TextComponent.arc = 12
ComboBox.padding = 5,10,5,10
ComboBox.selectionArc = 8
ComboBox.selectionBackground = #eeeafe
ComboBox.selectionForeground = #202738

TabbedPane.background = #f7f8fa
TabbedPane.foreground = #202738
TabbedPane.selectedBackground = #eeeafe
TabbedPane.selectedForeground = #6458e8
TabbedPane.hoverColor = #eeedf8
TabbedPane.focusColor = #eeeafe
TabbedPane.underlineColor = #6458e8
TabbedPane.inactiveUnderlineColor = #6458e8
TabbedPane.tabType = card
TabbedPane.cardTabArc = 12
TabbedPane.cardTabSelectionHeight = 0
TabbedPane.minimumTabWidth = 116
TabbedPane.maximumTabWidth = 116
TabbedPane.tabHeight = 42
TabbedPane.tabInsets = 12,18,12,18
TabbedPane.tabAreaInsets = 0,0,0,12
TabbedPane.contentSeparatorHeight = 0
TabbedPane.hasFullBorder = false
TabbedPane.tabsOpaque = false

Table.rowHeight = 32
Table.selectionBackground = #eeeafe
Table.selectionForeground = #202738
TableHeader.height = 32
TableHeader.background = #f7f8fa
TableHeader.foreground = #667085
TableHeader.cellMargins = 8,10,8,10
TableHeader.separatorColor = #e2e6ee
ScrollBar.width = 10
ScrollBar.thumbArc = 10
ScrollBar.trackArc = 10
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.track = #f7f8fa
ScrollBar.thumb = #c9ceda
ToolTip.background = #ffffff
ToolTip.foreground = #202738
